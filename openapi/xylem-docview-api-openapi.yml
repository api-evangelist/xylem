openapi: 3.2.0
info:
  title: Xylem Doc View API
  version: v3.5
  description: 'Operations tagged DocView across 2 of this provider''s published API definitions: xylem-apis-dev-swagger.json, xylem-apis-manager-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://apis-dev.xylem.com
tags:
- name: DocView
paths:
  /api/DocView/Get/DocTypes:
    get:
      tags:
      - DocView
      summary: Returns document types
      operationId: DocView_GetDocTypes
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocType'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocType'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocType'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocType'
      security:
      - Apis Manager: []
        Bearer: []
    servers:
    - url: https://apis-dev.xylem.com
  /api/DocView/Get/DocFields:
    get:
      tags:
      - DocView
      summary: Returns document fileds
      operationId: DocView_GetDocFields
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocField'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocField'
            application/json:
              schema:
                type: array
                items:

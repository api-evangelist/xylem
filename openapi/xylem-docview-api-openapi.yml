            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocField'
      security:
      - Apis Manager: []
        Bearer: []
    servers:
    - url: https://apis-dev.xylem.com
  /api/DocView/Get/DocFields/DocTypeId:
    get:
      tags:
      - DocView
      summary: Returns document fileds
      operationId: DocView_GetDocFieldsByDocTypeId
      parameters:
      - name: docTypeId
        in: query
        description: The document type id parameter.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocField'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocField'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocField'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocField'
      security:
      - Apis Manager: []
        Bearer: []
    servers:
    - url: https://apis-dev.xylem.com
  /api/DocView/Get/Docs:
    post:
      tags:
      - DocView
      summary: Returns documents
      operationId: DocView_GetDocs
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/DataTablesResponse_IDictionary_String_Object'
            text/xml:
              schema:
                $ref: '#/components/schemas/DataTablesResponse_IDictionary_String_Object'
            application/json:
              schema:
                $ref: '#/components/schemas/DataTablesResponse_IDictionary_String_Object'
            text/json:
              schema:
                $ref: '#/components/schemas/DataTablesResponse_IDictionary_String_Object'
      security:
      - Apis Manager: []
        Bearer: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/DocRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/DocRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DocRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DocRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocRequest'
        description: The paging, sorting and search parameter.
        required: true
    servers:
    - url: https://apis-dev.xylem.com
  /api/DocView/Get/Docs/OrderNumber:
    post:
      tags:
      - DocView
      summary: Returns documents by sales order number
      operationId: DocView_GetDocsByOrderNumber
      responses:

components:
  schemas:
    DocField:
      type: object
      properties:
        Id:
          format: int32
          type: integer
        TypeId:
          format: int32
          type: integer
        ERPField:
          type: string
        DisplayName:
          type: string
        Displayed:
          type: boolean
        DisplayOrder:
          format: int32
          type: integer
        Filtered:
          type: boolean
        Sorted:
          type: boolean
        Linked:
          type: boolean
    DataTablesColumn:
      type: object
      properties:
        Data:
          type: string
        Name:
          type: string
        Searchable:
          type: string
        Orderable:
          type: string
        Search:
          $ref: '#/components/schemas/DataTablesSearch'
    DataTablesOrder:
      type: object
      properties:
        Column:
          format: int32
          type: integer
        Dir:
          type: string
    DocType:
      type: object
      properties:
        Id:
          format: int32
          type: integer
        ERPType:
          type: string
        DisplayName:
          type: string
        DisplayOrder:
          format: int32
          type: integer
        Displayed:
          type: boolean
    DataResponse_Object:
      type: object
      properties:
        Data:
          type: object
    DocRequestOrder:
      type: object
      properties:
        DocTypeId:
          format: int32
          type: integer
        OrderNumber:
          type: string
    DataTablesRequest:
      type: object
      properties:
        Start:
          format: int32
          type: integer
        Length:
          format: int32
          type: integer
        Draw:
          format: int32
          type: integer
        Columns:
          type: array
          items:
            $ref: '#/components/schemas/DataTablesColumn'
        Order:
          type: array
          items:
            $ref: '#/components/schemas/DataTablesOrder'
        Search:
          $ref: '#/components/schemas/DataTablesSearch'
    DocRequestRange:
      type: object
      properties:
        DocTypeId:
          format: int32
          type: integer
        BusinessPartners:
          type: array
          items:
            type: string
        UseDateModified:
          type: boolean
        DateFrom:
          format: date-time
          type: string
        DateTo:
          format: date-time
          type: string
        Limit:
          format: int32
          type: integer
        Offset:
          format: int32
          type: integer
    DataTablesResponse_IDictionary_String_Object:
      type: object
      properties:
        Draw:
          format: int32
          type: integer
        RecordsTotal:
          format: int32
          type: integer
        RecordsFiltered:
          format: int32
          type: integer
        Data:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
    DocRequest:
      type: object
      properties:
        DocUser:
          type: string
        DocType:
          type: string
        DocData:
          $ref: '#/components/schemas/DataTablesRequest'
    RepInfo:
      type: object
      properties:
        RepType:
          type: string
        RepCode:
          type: string
    DataTablesSearch:
      type: object
      properties:
        Value:
          type: string
        Regex:
          type: string
  securitySchemes:
    Apis_Manager:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /token
x-refined-from:
- xylem-apis-dev-swagger.json
- xylem-apis-manager-openapi.yml

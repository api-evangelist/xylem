description: >-
  Xylem Inc. (NYSE: XYL) is a global water technology company that moves, treats,
  analyzes, monitors and returns water to the environment across the full water cycle.
  Its brands include Sensus smart metering and AMI networks, Xylem Vue utility
  operations software built with Idrica's GoAigua platform, YSI water quality
  instrumentation, HYPACK hydrographic survey software, and the Flygt, Godwin, WEDECO
  and Aanderaa product lines. Xylem operates live, first-party API hosts for Xylem
  Cloud, the Xylem Vue services and its product selector, but publishes no API contract,
  developer portal or reference for any of them; the one machine-readable document it
  serves anonymously is the OpenID Connect discovery metadata for the Xylem Cloud
  identity realm.

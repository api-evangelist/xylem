note: >-
  One real first-party document was found, and it is not at a root /.well-known/ path.
  Xylem Cloud runs Keycloak under the /xcloud/auth path prefix, so its OpenID Connect
  discovery document is served at
  https://cloud.xylem.com/xcloud/auth/realms/xcloud/.well-known/openid-configuration
  (HTTP 200, application/json, 6,875 bytes). It is saved verbatim as
  xylem-openid-configuration.json and is the source for authentication/, scopes/ and
  conformance/. Every root-level /.well-known/ path on xylem.com and www.xylem.com
  returns HTTP 404 rendered as the site's branded NotFound page. cloud.xylem.com
  answers root /.well-known/* with an S3 AccessDenied (403). trust.xylem.com is behind
  a Cloudflare interstitial (403 "Just a moment...") — a bot challenge, not an absence.
  The ONE 200 on a root path in this probe is status.xylem.com/.well-known/security.txt,
  and it is NOT Xylem's: it is Atlassian's Statuspage security.txt (Contact:
  https://www.atlassian.com/trust/), served by the vendor on a CNAMEd Xylem host. It is
  recorded here as a vendor document and is deliberately NOT credited to Xylem, and no
  SecurityTxt pointer is emitted for it.
